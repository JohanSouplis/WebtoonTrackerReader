<div class="brand">
  <span class="logo"><mat-icon class="is-filled">auto_stories</mat-icon></span>
  Scan Tracker
</div>
<nav aria-label="Main">
  @for (tab of tabs(); track tab.path) {
    <button
      type="button"
      [attr.aria-current]="tab.isSelected ? 'page' : null"
      (click)="navigated.emit(tab.path)"
    >
      <mat-icon>{{ tab.icon }}</mat-icon>
      {{ tab.label }}
    </button>
  }
</nav>
<button
  type="button"
  class="informations"
  aria-label="Informations"
  matTooltip="Informations"
  [matMenuTriggerFor]="menu"
>
  <mat-icon>info</mat-icon>
</button>
<mat-menu #menu="matMenu" xPosition="before">
  <button mat-menu-item (click)="fullPageRequested.emit()">
    <mat-icon>info</mat-icon>
    Informations
  </button>
  <button mat-menu-item (click)="reviewsRequested.emit()">
    <mat-icon>grade</mat-icon>
    Rate the extension
  </button>
</mat-menu>
