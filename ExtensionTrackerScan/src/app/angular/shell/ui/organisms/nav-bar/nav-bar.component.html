<div class="brand">
  <span class="logo"><mat-icon class="is-filled">auto_stories</mat-icon></span>
  <span class="brand-name">Scan Tracker</span>
</div>
<nav aria-label="Main">
  @for (tab of tabs(); track tab.path) {
    <button
      type="button"
      [attr.aria-current]="tab.isSelected ? 'page' : null"
      (click)="navigated.emit(tab.path)"
    >
      <mat-icon>{{ tab.icon }}</mat-icon>
      {{ tab.label }}
    </button>
  }
</nav>
<button
  type="button"
  class="about"
  aria-label="About"
  matTooltip="About"
  [attr.aria-current]="isAboutSelected() ? 'page' : null"
  (click)="navigated.emit(aboutPath)"
>
  <mat-icon>info</mat-icon>
</button>
