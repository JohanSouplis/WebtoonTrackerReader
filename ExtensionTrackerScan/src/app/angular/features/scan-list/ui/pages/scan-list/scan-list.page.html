@if (store.hasPendingSeries()) {
<app-pending-series
  [groups]="store.pendingGroups()"
  [now]="now"
  (added)="addSeries($event)"
  (renamed)="addSeriesAs($event)"
  (dismissed)="dismissSeries($event)"
  (mergeRequested)="mergeSeries($event)"
  (siteAdded)="addSiteSeries($event)"
/>
} @if (store.hasLibraryTools()) {
<app-scan-filters
  [filters]="store.filters()"
  (filtersChanged)="store.filter($event)"
/>
<app-scan-sort-bar
  [sort]="store.sort()"
  [count]="store.count()"
  (sorted)="store.sortBy($event)"
>
  <app-new-chapter-settings
    [settings]="store.settings()"
    (intervalChosen)="chooseInterval($event)"
    (notificationsToggled)="toggleNotifications($event)"
  />
</app-scan-sort-bar>
}
<app-scan-rows
  [view]="store.view()"
  [now]="now"
  (deleted)="delete($event)"
  (favoriteToggled)="toggleFavorite($event)"
  (rated)="rate($event)"
  (ratingCleared)="clearRating($event)"
  (renamed)="rename($event)"
  (mergeRequested)="openMergePicker($event)"
  (handoffRequested)="openContinueOnPhone($event)"
  (newChapterOpened)="recordNewChapterOpened()"
  (pageTurned)="store.turnPage($event)"
  (filtersCleared)="store.clearFilters()"
  (retried)="loadLibrary()"
>
  @if (store.isAskingForRating()) {
  <app-rate-prompt (answered)="answerRatePrompt($event)" />
  }
</app-scan-rows>
<ng-template #continueOnPhone let-handoff let-dialogRef="dialogRef">
  <app-continue-on-phone [handoff]="handoff" (closed)="dialogRef.close()" />
</ng-template>
<ng-template #mergePicker let-source let-dialogRef="dialogRef">
  <app-merge-picker
    [source]="source"
    [titles]="store.titles()"
    (picked)="dialogRef.close($event)"
    (cancelled)="dialogRef.close()"
  />
</ng-template>
