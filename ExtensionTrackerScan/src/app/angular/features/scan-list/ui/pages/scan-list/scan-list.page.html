<div class="mat-elevation-z8">
  <app-scan-filters
    [filters]="store.filters()"
    [title]="store.titleFilter()"
    (filtersChanged)="store.applyFilters($event)"
    (searched)="store.searchTitle($event)"
  />
  <app-scan-table
    [scans]="store.scans()"
    [titleFilter]="store.titleFilter()"
    (deleted)="delete($event)"
    (favoriteToggled)="toggleFavorite($event)"
    (rated)="rate($event)"
    (opened)="open($event)"
  />
</div>
