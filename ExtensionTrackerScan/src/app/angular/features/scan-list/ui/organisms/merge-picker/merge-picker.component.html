<h2 [id]="headingId">Merge “{{ source() }}” into…</h2>
<p class="hint">
  The series you pick keeps its title and takes the latest chapter. Readings
  under either title land on it.
</p>
<form (submit)="pickFirst($event)">
  <ds-search-field
    label="Find a series"
    [value]="query()"
    (searched)="query.set($event)"
  />
</form>
@if (targets().length > 0) {
  <ul aria-label="Series to merge into">
    @for (title of targets(); track title) {
      <li>
        <button type="button" (click)="picked.emit(title)">{{ title }}</button>
      </li>
    }
  </ul>
} @else {
  <p class="none" role="status">No other series match.</p>
}
<div class="actions">
  <button type="button" class="cancel" (click)="cancelled.emit()">
    Cancel
  </button>
</div>
