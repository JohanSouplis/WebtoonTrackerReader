<button type="button" class="trigger" [matMenuTriggerFor]="menu">
  <mat-icon [class.is-filled]="settings().areNotificationsOn">{{
    icon()
  }}</mat-icon>
  {{ summary() }}
</button>
<mat-menu #menu="matMenu" class="new-chapter-settings-panel">
  <p class="heading">Check followed series for new chapters</p>
  @for (option of frequencies(); track option.frequency) {
    <button
      mat-menu-item
      role="menuitemradio"
      [attr.aria-checked]="option.isChosen"
      (click)="intervalChosen.emit(option.frequency)"
    >
      <mat-icon>{{ option.isChosen ? "check" : "" }}</mat-icon>
      {{ option.name }}
    </button>
  }
  <div class="separator"></div>
  <button
    mat-menu-item
    role="menuitemcheckbox"
    [attr.aria-checked]="settings().areNotificationsOn"
    (click)="notificationsToggled.emit(!settings().areNotificationsOn)"
  >
    <mat-icon>{{ settings().areNotificationsOn ? "check" : "" }}</mat-icon>
    Desktop alerts
  </button>
  <p class="note">New chapters also show as a count on the toolbar icon.</p>
</mat-menu>
