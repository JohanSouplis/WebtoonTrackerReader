<ds-search-field
  label="Filter by title"
  [value]="filters().title"
  (searched)="change({ title: $event })"
/>
<mat-button-toggle
  [checked]="filters().favoritesOnly"
  (change)="change({ favoritesOnly: $event.source.checked })"
>
  <mat-icon [class.is-filled]="filters().favoritesOnly">star</mat-icon>
  Favorites only
</mat-button-toggle>
<mat-button-toggle
  [checked]="filters().ratedOnly"
  (change)="change({ ratedOnly: $event.source.checked })"
>
  <mat-icon>grade</mat-icon>
  Rated only
</mat-button-toggle>
