<mat-table [dataSource]="dataSource" matSort>
  <ng-container matColumnDef="delete">
    <mat-header-cell
      *matHeaderCellDef
      class="delete-column delete-header"
    ></mat-header-cell>
    <mat-cell *matCellDef="let scan" class="delete-column">
      <img
        src="assets/delete.png"
        alt="assets/delete.png"
        class="delete-icon"
        (click)="delete(scan)"
      />
    </mat-cell>
  </ng-container>

  <ng-container matColumnDef="favorite">
    <mat-header-cell
      *matHeaderCellDef
      mat-sort-header
      start="desc"
      class="favorite-column"
    >
      Fav
    </mat-header-cell>
    <mat-cell *matCellDef="let scan">
      <ds-star-toggle
        [checked]="scan.isFavorite"
        label="Favorite"
        (toggled)="favoriteToggled.emit(scan)"
      />
    </mat-cell>
  </ng-container>

  <ng-container matColumnDef="title">
    <mat-header-cell
      *matHeaderCellDef
      mat-sort-header
      class="title-column title-header"
      >Title</mat-header-cell
    >
    <mat-cell *matCellDef="let scan" class="title-column">
      <a (click)="opened.emit(scan.url)">
        <ds-truncated-text [text]="scan.title" [maxLength]="100" />
      </a>
    </mat-cell>
  </ng-container>

  <ng-container matColumnDef="chapter">
    <mat-header-cell
      *matHeaderCellDef
      mat-sort-header
      start="desc"
      class="chapter-column chapter-header"
      >Chapter</mat-header-cell
    >
    <mat-cell *matCellDef="let scan" class="chapter-column">{{
      scan.chapter
    }}</mat-cell>
  </ng-container>

  <ng-container matColumnDef="readAt">
    <mat-header-cell
      start="desc"
      *matHeaderCellDef
      mat-sort-header
      class="read-at-column read-at-header"
      >Was read</mat-header-cell
    >
    <mat-cell *matCellDef="let scan" class="read-at-column">{{
      scan.readAt | date: "dd/MM/yyyy"
    }}</mat-cell>
  </ng-container>

  <ng-container matColumnDef="rating">
    <mat-header-cell
      start="desc"
      *matHeaderCellDef
      mat-sort-header
      class="rating-column rating-header"
      >Rating</mat-header-cell
    >
    <mat-cell *matCellDef="let scan" class="rating-column">
      <mat-form-field>
        <mat-select
          [value]="scan.rating"
          (selectionChange)="rated.emit({ scan, rating: $event.value })"
        >
          @for (rating of ratings; track rating) {
            <mat-option [value]="rating">
              {{ rating }}
            </mat-option>
          }
        </mat-select>
      </mat-form-field>
    </mat-cell>
  </ng-container>

  <mat-header-row *matHeaderRowDef="columns"></mat-header-row>
  <mat-row *matRowDef="let row; columns: columns"></mat-row>
</mat-table>

<mat-paginator
  [pageSize]="10"
  [pageSizeOptions]="[5, 10, 20, 50, 100]"
  showFirstLastButtons
></mat-paginator>
