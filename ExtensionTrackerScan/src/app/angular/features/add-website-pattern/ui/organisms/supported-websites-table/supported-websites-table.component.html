<div class="available-websites">
  <h2>Available websites for now</h2>
  <ds-search-field
    label="Filter by website"
    [value]="query()"
    (searched)="filter($event)"
  />

  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
    <ng-container matColumnDef="website">
      <td mat-cell *matCellDef="let website">{{ website }}</td>
    </ng-container>
    <tr mat-row *matRowDef="let row; columns: columns"></tr>
  </table>

  <mat-paginator [pageSize]="10" showFirstLastButtons></mat-paginator>
</div>
<p class="filter-info">
  The website url is the one where you read a story and not the one where you
  can see the list of different stories. Sometimes its different, some websites
  use redirection for url.
</p>
